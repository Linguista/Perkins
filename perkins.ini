################################################################################
#                                                                              #
#                    PERKINS CONFIGURATION FILE (perkins.ini)                  #
#                    Current as of Perkins v2.0.38 (2026-11-11)                #
#                                                                              #
#  Settings in this file override Perkins' built-in defaults. Command-line     #
#  options override settings in this file.                                     #
#                                                                              #
#  UNKNOWN KEYS ARE REJECTED. Perkins validates every name in this file        #
#  against its own internal list, so a typo does not silently create a new     #
#  setting -- it stops the run. Spelling therefore matters exactly.            #
#                                                                              #
#  RENAMED IN v2.0.17: g2p_format is now mfa_format. The old name is no        #
#  longer accepted and will be rejected as unknown. The default output         #
#  extension changed with it, .G2P -> .MFA.                                    #
#                                                                              #
#  NOT EVERYTHING IS SETTABLE HERE. Several options exist only on the          #
#  command line -- see COMMAND-LINE-ONLY OPTIONS at the end of this file.      #
#                                                                              #
#  This file is named "perkins.ini" by default, but that's just a default:     #
#  use --config-file=NAME (or the short form -cf NAME) on the command line     #
#  to have Perkins read a differently-named or differently-located file        #
#  instead, e.g.:                                                              #
#      perkins -i myinput.txt -cfg --config-file=corpora.ini                   #
#      perkins -i myinput.txt -cfg -cf hardwork.cfg                            #
#  (This setting can only be given on the command line -- it can't be set      #
#  from inside a config file, for the obvious chicken-and-egg reason.)         #
#                                                                              #
#  SYNTAX                                                                      #
#    variable_name = value                                                     #
#    # This is a comment because it starts with a pound sign/octothorpe        #
#    variable_name = value      # Inline comments like this are also fine      #
#                                                                              #
#  VALUES                                                                      #
#    Boolean options:  1 = enabled, 0 = disabled                               #
#    String options:   plain text (no quotes)                                  #
#                                                                              #
#  To activate a setting, remove the leading # from the line and assign a      #
#  value to it (0 or 1).                                                       #
#                                                                              #
################################################################################


################################################################################
# PROGRAM BEHAVIOR                                                             #
################################################################################

# Enable debug output to terminal.
# debug = 1

# Enable debug output specifically for the syllabification subroutine.
# debug_syllab_sub = 1

# Write debug information to a log file instead of (or in addition to) terminal.
# debug_to_logfile = 1

# Silent mode: suppress most terminal output.
# silent_mode = 1

# Batch mode: suppress all stdout output. Useful for scripted/automated runs.
# batch_mode = 1


################################################################################
# META-CONFIGURATIONS (preset combinations of options)                         #
# WARNING: Each of these overrides most individual settings below.             #
# Only enable ONE at a time.                                                   #
################################################################################

# Corpus / running-text mode (optimised for COSCACH/CODICACH, but applicable to
# other corpora). Syllabifies at sentence level, one character per phoneme, etc.
# This overrides most other settings, so disable it when you need fine control.
# corpus_running_text = 1

# Syllable-list mode: each syllable is separated from the others by a space.
# Designed to let syllables be treated as words in downstream corpus tools.
# This overrides most other settings.
# syllable_list = 1

# Word-list mode (-vrt): one transcribed word per line (with split_at_syllables,
# one syllable per line), without pauses, syllabified by word, stress marked
# with an accent, one character per phoneme. The output file is named .vrt.
# This overrides most other settings.
# vrt_format = 1

# Word-list mode: syllabified at word level, syllables separated by a dot,
# words separated by a space. Doesn't specify a transcription output format,
# so it can be combined with one of the OUTPUT FORMAT settings below (e.g.
# output_CV) -- if none is set, it falls back to standard phonemic output.
# word_list = 1

# COSCACH mode: preset tuned for the COSCACH/CODICACH corpus transcription
# conventions (retracted affricates without ligatures, dental diacritics,
# tilde-marked stress, syllable dots as spaces).
# This overrides most other settings.
# coscach_mode = 1

# Process all date ranges (1–4 digit numbers and BC dates). Equivalent to
# enabling narrow_year_ranges, broad_year_ranges, and bc_dates_included.
# all_year_ranges = 1


################################################################################
# TRANSCRIPTION OUTPUT FORMAT                                                  #
################################################################################

# Standard phonemic (IPA) transcription. This is the normal, default output.
# output_PHON = 1

# Output consonant/vowel skeleton only (C or V for each phoneme).
# output_CV = 1

# Output C/V/G skeleton (C = consonant, V = vowel, G = glide).
# output_CVG = 1

# Output C/V/N/L/R/G skeleton (Consonant/Vowel/Nasal/Liquid/Rhotic/Glide).
# output_CVNLRG = 1

# Output manner of articulation for each segment.
# output_manner = 1

# Output place of articulation for each segment (B bilabial, L labiodental,
# D dental, A alveolar, T postalveolar, P palatal, V velar, W labiovelar,
# - vowel).
# output_place = 1

# Output voicing for each segment (S voiced, A voiceless).
# voicing = 1

# MFA dictionary format: output one word per line as
# "ortho<TAB>p h o n e m e s". Each line contains the orthographic word
# (with any tildes/accents from the original text preserved), a TAB, then
# the individual IPA phonemes separated by spaces. For the Montreal Forced
# Aligner.
#
# RENAMED in v2.0.17 from g2p_format; the old name is now rejected.
#
# THREE THINGS THIS MODE ENFORCES, and they cannot be overridden from here:
#   - NO STRESS MARKS in the phone column. MFA treats each space-delimited
#     token as an atomic phone symbol, so a stressed vowel is a DIFFERENT
#     phone -- it would split one vowel's training data across two symbols.
#     Forced since v2.0.9, guarded since v2.0.18. Setting stress_using_tildes
#     or no_stress_marks here has no effect on -mfa output.
#   - EXACTLY ONE TAB between word and pronunciation, phones separated by
#     spaces, nothing colliding with MFA's reserved sil/spn/<unk>/<eps>.
#     Entries that cannot be made valid are DROPPED and counted, never
#     repaired into something plausible (v2.0.17).
#   - NOTHING OUTSIDE THE PHONE INVENTORY (v2.0.20). An out-of-inventory
#     phone parses perfectly and then fails to align, silently. Encoding
#     variants of the same phone are rewritten to one spelling; genuinely
#     different phones are rejected and reported, not mapped onto something
#     else. Override the inventory with --mfa-phoneset (command line only).
#
# The orthographic column is deliberately NOT policed -- MFA looks a word up
# by matching the transcript's own orthography, so its accents are required.
# mfa_format = 1

# Phonword format: output one word per line as "Ortho<TAB>tran.scrip.tion".
# Each line contains the orthographic word (with tildes), a tab, then the
# complete phonemic transcription with stress and syllable-boundary markers.
# Designed to populate word-level orthographic and phonemic tiers in Praat.
#
# SINCE v2.0.32: an output format (output_CV ... voicing, or -f= on the command
# line), no syllable dots (-nosd), syllable dots as spaces and no stress marks
# are honoured; until v2.0.31 phonword silently ignored all of them. Combined
# with word_list, it writes exactly ONE line per input line: the input line
# verbatim, a tab, and the transcription of everything that line produced.
# phonword_format = 1


################################################################################
# SPECIFIC PHONEMES                                                            #
################################################################################

# Use multi-character IPA symbols for certain phonemes
# (e.g. t̠͡ʃ instead of the single character ʧ).
# multichars = 1

# Treat /tr/ as a phonological group of two phonemes, producing t͡ɾ (multichars)
# or ʂ (no multichars). The latter option is specific to Chilean Spanish.
# tr_is_group = 1

# Add retracted diacritic to /t̠͡ʃ/ and /d̠͡ʒ/ digraphs (when /ʝ/ is not used).
# ch_dzh_retracted = 1

# Use ligatures (tie bars) with /t̠͡ʃ/ and /d̠͡ʒ/. When set to 0, output is
# /t̠ʃ/ and /d̠ʒ/ (separate characters, no tie bar).
# use_ligatures = 1

# Always use the single-character /ʧ/ symbol, regardless of the multichars
# setting. Overrides the multichars flag for the CH phoneme only.
# use_one_char_ch_symbol = 1

# Represent the "ye" phoneme (<ll> in "ella", <y> in "yo") as the palatal
# fricative ʝ. If disabled, the affricate d͡ʒ is used instead.
# CHANGED IN v2.0.23: the affricate is now POSTALVEOLAR, d + ezh. It was
# previously written with the MFA Spanish dictionary's own convention, which
# describes a different articulation; this project trains its own acoustic
# model and does not follow it.
# NOTE: ye_phoneme_is_fricative and ye_phoneme_is_affricate must be opposites.
# ye_phoneme_is_fricative = 1
# ye_phoneme_is_affricate = 0

# Always use the single-character /ʝ/ symbol, regardless of the multichars
# setting. Overrides the multichars flag for the YE phoneme only.
# use_one_char_ye_symbol = 1

# Use dental diacritics with /d/ and /t/ (i.e. /d̪/ and /t̪/).
# use_dental_diacr = 1

# Add an epenthetic [g] before /w/ in words like "huevo" → [gwebo].
# Traditionally considered ubiquitous in Chilean Spanish but actually uncommon.
# add_epenthetic_g = 1


################################################################################
# CH SHORTCUT SETTINGS                                                         #
# These five options select a complete CH representation in one step,          #
# instead of combining multichars, use_ligatures, and ch_dzh_retracted         #
# manually. Enable at most ONE of these at a time. They override all other     #
# settings that affect CH.                                                     #
################################################################################

# Represent CH as the single IPA character ʧ
# ch_is_single_char = 1

# Represent CH as retracted with ligature: t̠͡ʃ
# ch_is_retracted_with_ligature = 1

# Represent CH as retracted without ligature: t̠ʃ
# ch_is_retracted_no_ligature = 1

# Represent CH as non-retracted with ligature: t͡ʃ
# ch_not_retracted_with_ligature = 1

# Represent CH as non-retracted without ligature: tʃ
# ch_not_retracted_no_ligature = 1


################################################################################
# GLIDES                                                                       #
################################################################################

# Master switch: represent non-syllabic glides using a vowel plus a non-syllabic
# diacritic (/u̯/ and /i̯/) instead of /w/ and /j/. Enabling this is equivalent
# to enabling both non_syl_u_with_u_diacr and non_syl_i_with_i_diacr.
# glides_with_diacritics = 1

# Represent non-syllabic /u/ as /u̯/ (with diacritic) instead of /w/.
# non_syl_u_with_u_diacr = 1

# Represent non-syllabic /i/ as /i̯/ (with diacritic) instead of /j/.
# non_syl_i_with_i_diacr = 1


################################################################################
# STRESS MARKING                                                               #
################################################################################

# Mark stress with tildes on the stressed vowel (á, é, í, ó, ú) instead of
# placing the IPA primary stress marker (ˈ) before the stressed syllable.
# stress_using_tildes = 1

# Omit all stress marking entirely. For special-purpose output only.
# no_stress_marks = 1

# Use the standard orthographic apostrophe (') for stress instead of the IPA
# primary stress marker (ˈ).
# non_ipa_apostrophes = 1


################################################################################
# NARROW (ALLOPHONIC) TRANSCRIPTION                                            #
################################################################################

# Apply Chilean Spanish narrow-transcription rules on top of whatever phonemic
# output the current mode already produces. Added in v2.0.9; works with EVERY
# output mode -- mfa_format, running text, phonword and the rest -- rather than
# being tied to one. Command-line equivalent: -nt / --narrow.
#
# What it implements: b/d/g lenition (a stop after a pause, after a nasal,
# and d after l; otherwise v/d/g in the coda and after a consonant, and the
# approximants after a vowel or glide -- rewritten in v2.0.32), yeismo
# affrication, full nasal place assimilation for /n/, velar palatalization
# before front vowels and the glide j, and vowel nasalization.
#
# What it deliberately does NOT implement: the free-variation phenomena --
# fricative-vs-approximant spirantization quality, d-elision, and theta as a
# sociolinguistic allophone of /s/. None is determinable from text alone, so
# they belong to the phone recognizer or to MFA's rules.yaml instead.
#
# See perkins-narrow-transcription-ruleset_README for every rule in full.
#
# NOTE: this is REFUSED with the CV, CVG, CVNLRG and voicing output formats
# (hard error since v2.0.13) -- those formats cannot express the distinctions
# --narrow makes, so producing them together would be silently meaningless.
# narrow_transcription = 1


################################################################################
# SYLLABLES                                                                    #
################################################################################

# Mark syllable boundaries with a dot (e.g. /kom.pu.ta.ˈd̪o.ɾa/).
# insert_syllable_dots = 1

# One syllable per line, without pauses or stress marks, as needed for
# syllable frequency analysis. The syllables are cut from running text when
# syllabify_by_sentence = 1 (the default), from each word on its own when it
# is 0. Command line: -sas, -osl.
# split_at_syllables = 1

# Syllabify across word boundaries at the sentence level, so that
# resyllabification is reflected (e.g. "los hombres" → /lo.som.bɾes/
# instead of /los om.bɾes/).
# syllabify_by_sentence = 1

# Separate syllables with spaces instead of dots. Allows syllables to be
# treated as "words" in downstream corpus tools.
# syllable_dots_are_spaces = 1


################################################################################
# PAUSES                                                                       #
################################################################################

# Use IPA pause symbols: | for short/medium pauses and ‖ for long pauses.
# ipa_pause_symbols = 1

# Represent long IPA pauses as two single bars (||) instead of one double
# bar (‖).
# ipa_long_pause_two_singles = 1

# Convert commas into short pauses (|), in running text and with --tokens.
# A pause blocks the narrow rules across it. -mfa, -phonword and vertical
# output switch this off themselves. Command line: -cmp, -nocmp.
# add_comma_pauses = 1

# Convert colons into long pauses (‖), as semicolons are. Command line: -clp,
# -noclp. Off deletes the colon, in running text and with --tokens. -mfa,
# -phonword and vertical output switch it off for what they print; a colon
# still blocks the narrow rules there unless you switch it off yourself.
# add_colon_pauses = 1

# Convert semicolons into long pauses (‖). Command line: -scp, -noscp. Off
# works as for colons above.
# add_semicolon_pauses = 1

# Convert sentence-ending punctuation (. ! ?) into absolute breaks. Off
# (-nosnp) deletes it instead. The period of an abbreviation (Sr., Sra., art.)
# is not a sentence end.
# add_sentence_breaks = 1

# Convert paragraph breaks into the longest pause marker.
# add_paragraph_breaks = 1

# Convert ellipses (... or …) into a long pause. Off (-noelp) deletes them.
# add_ellipsis_pauses = 1

# Convert square brackets [ and ] into short pauses.
# add_bracket_pauses = 1

# Convert parentheses ( and ) into short pauses.
# add_paren_pauses = 1


################################################################################
# NUMBERS                                                                      #
################################################################################

# Convert numerals (e.g. 123) into Spanish words (e.g. "ciento veintitrés").
# numerals_to_words = 1

# When numeral replacement (not word conversion) is selected with -sn on the
# command line, replace each numeral digit with this character. This option
# is for when you have no interest in numerals at all and just want to
# eliminate them.
# num_symbol = ·

# Which symbol separates whole numbers from fractions (the decimal point):
# "," or ".". The OTHER symbol is treated as the thousands (grouping)
# separator throughout number processing (currency, percentages, units,
# plain decimals). Can also be set on the command line with
# --decimal-period/-dp (period is decimal) or --decimal-comma/-dc (comma is
# decimal). Default "," matches the Spanish/Chilean convention: "12,35" is
# twelve point thirty-five; "1.500" is one thousand five hundred.
# decimal_symbol = ,

# Treat two consecutive 4-digit numbers separated by "-" as a year range
# (e.g. "1900-1950" → "1900 a 1950") when the second number is larger.
# narrow_year_ranges = 1

# Treat two consecutive 1-4 digit numbers separated by "-" as a year range
# (e.g. "211-300" → "211 a 300") when the second number is larger.
# broad_year_ranges = 1

# Remove the restriction that the second number must be larger, allowing
# BC ranges (e.g. "500-200 a.C.") to be treated as year ranges.
# bc_dates_included = 1

# Process times written with a colon (e.g. 1:45, 2:30, 14:59).
# times_with_colon = 1


################################################################################
# ODD / SPECIAL CHARACTERS / CLEANUP                                           #
################################################################################

# Convert vowels with umlauts to bare vowels (ä → a, ö → o, ü → u), except
# where ü is used as a Spanish diéresis (e.g. "güiro" — left unchanged).
# fix_umlauts = 1

# Convert vowels with grave accents to acute accents (tù → tú, està → está).
# fix_grave_accents = 1

# Convert vowels with circumflexes to bare vowels (hôstel → hostel).
# fix_circumflexes = 1

# Convert vowels with nasal tildes to bare vowels (São → Sao).
# fix_nasal_tildes = 1


################################################################################
# CHARACTER / STRING SUBSTITUTIONS                                             #
################################################################################

# Text to substitute for the "$" currency symbol when no recognised currency
# prefix (USD, MX$, etc.) precedes the amount. Must be given as a plural noun.
# moneda = pesos

# How to read the letter K when it appears as the check digit in a Chilean
# RUT (ID number). Use "letter" to pronounce it as "k", or "ka" to say "ka".
# rut_k_mode = letter

# Text to substitute for the "/" slash character.
# slash = eslách

# Process URLs, treating them as linguistic strings to be transcribed.
# process_urls = 1

# Process e-mail addresses, treating them as linguistic strings to transcribe.
# process_email = 1

# Name for the letter "v" when Perkins spells out individual letters.
# Common choices: becórta, bechíca, úve (write with tilde on stressed syllable,
# as one word, no quotes).
# name_for_v = becórta


################################################################################
# MISCELLANEOUS OUTPUT OPTIONS                                                 #
################################################################################

# Preserve paragraph breaks from the source text in the output. When disabled,
# the output is one continuous block of transcription.
# keep_paragraphs = 1

# One word per line, without pauses, syllabified by word (a word list).
# Command line: -owl.
# vertical_output = 1

# Reduce three or more identical adjacent vowels to two. Useful for
# cleaning up informal or OCR-processed input text
# (e.g. "aaa" → "aa", "eeee" → "ee"); genuine Spanish double vowels
# (e.g. "leer", "creer") are left untouched.
# triple_vowels_to_double = 1


################################################################################
# ADVANCED OPTIONS                                                             #
# Change these only if you understand their effects. Incorrect values can      #
# produce unexpected or broken output.                                         #
################################################################################

# Force all output to uppercase. Works correctly for CV, CVG, CVNLRG, manner,
# place, and voicing output types, but is harmful for standard phonemic (IPA)
# transcription, so it is disabled by default.
# upper_case = 0

# For testing purposes: eliminate high-frequency Spanish words (de, la, que, etc.)
# fromthe output so that novel transcription errors in less common words are
# easier to spot. Not intended for normal use.
# kill_common_words = 0


################################################################################
# BROKEN / EXPERIMENTAL OPTIONS                                                #
# These options exist in the codebase but are not fully implemented.           #
# Do not enable them in production runs.                                       #
################################################################################

# WARNING — BROKEN. Separate output phonemes with spaces.
# space_between_phonemes = 0

# WARNING — BROKEN. Output the input word followed by a tab and its phonemes.
# Implies space_between_phonemes = 1.
# word_plus_phonemes = 0


################################################################################
# COMMAND-LINE-ONLY OPTIONS                                                    #
# These have NO perkins.ini key and cannot be set from this file. They are     #
# listed here only so that looking for them and not finding them above is not  #
# mistaken for an omission.                                                    #
################################################################################

# --config-file=NAME, -cf NAME
#     Read a differently-named or differently-located config file instead of
#     perkins.ini. Command line only, for the obvious chicken-and-egg reason.
#
# --mfa-phoneset FILE                                          (added v2.0.23)
#     Override the built-in phone inventory used to validate -mfa output.
#     One phone per line; blank lines and # comments ignored. The inventory
#     used to be compiled in, which was right while the target was a
#     pretrained model and wrong once the project defined its own -- an
#     inventory baked into a binary makes changing it a rebuild.
#
#     NOTE the built-in default is NO LONGER the Latin American inventory
#     (v2.0.24). It is a working default for Chilean output. Point this at
#     the project's own list once that list is settled.
#
# --mfa-rules                                                  (added v2.0.19)
#     Apply the MFA Spanish dictionary's OWN allophonic rules to -mfa output,
#     using its own exact characters. Every rule and codepoint was derived by
#     measurement from the installed dictionary, not from Spanish phonology.
#
#     NOT for the training path, and it should be considered frozen for
#     Chilean purposes (v2.0.25). The training dictionary is plain -mfa --
#     canonical phonemes, one pronunciation per word -- and allophones come
#     from the project's own allophone table with its context and rank. This
#     flag exists for work targeting a PRETRAINED model. Two places holding
#     allophonic knowledge is one too many.
#
#     Default OFF, deliberately: switching it on silently would invalidate
#     every comparison against the current master pronunciation dictionary.
#     Turn it on for a full regeneration, never piecemeal.
#
# -nt, --narrow
#     Command-line equivalent of narrow_transcription above.
#
# --tokens, -tok                                                (added v2.0.32)
#     Token mode. Each input line is one sentence whose tokens are separated by
#     TABs; each output line holds exactly one TAB-separated transcription per
#     token (empty for a token that produces nothing). The narrow rules see the
#     whole sentence, so a word-initial b after a vowel-final word lenites.
#     Written for annotating FreeLing CoNLL files token by token.
#
# --mfa-wl, --mfa-rt                                           (renamed v2.0.17)
#     Word-list and running-text variants of -mfa. Formerly --g2p-wl and
#     --g2p-rt; the old spellings are a HARD ERROR (exit 2) naming the
#     replacement, not a silent alias -- an alias would let callers keep
#     working while the project's own scripts drifted apart from the tool
#     again, which has already happened more than once here.
#
# -dp, --decimal-period  /  -dc, --decimal-comma
#     Command-line equivalents of decimal_symbol above.


################################################################################
# PHONETIC CHANGES SINCE v2.0.20 THAT NO SETTING CONTROLS                      #
# Recorded here because they change output without any key in this file, so a  #
# transcription made before and after them will differ with nothing in the     #
# config to explain why.                                                       #
################################################################################

# v2.0.23  The voiced palatal affricate became POSTALVEOLAR (d + ezh).
#
# v2.0.24  /b/ now lenites to a LABIODENTAL -- approximant between vowels,
#          fricative elsewhere -- not to bilabial beta. Chilean /b/ is almost
#          always labiodental, and in the project's own allophone table both
#          bilabial outcomes are ranked 0, meaning they essentially never
#          occur. Emitting beta told the aligner to expect a sound Chilean
#          speakers do not produce.
#          Consequence: the labiodental nasal is now triggered by ANY
#          labiodental, not by f alone.
#
# v2.0.25  /d/ and /g/ now lenite to the APPROXIMANT forms (base plus the
#          lowering diacritic) rather than the plain fricatives, matching what
#          /b/ received in v2.0.24. All three Spanish voiced obstruents are
#          approximants in their lenited Chilean realisations. The plain
#          fricatives remain legal phones, so a dictionary using either still
#          validates.


################################################################################
# CHANGES IN v2.0.35 THAT NO SETTING CONTROLS                                  #
################################################################################

# A third built-in respelling table, matched without regard to case after the
# exact-case table and the fixed transcriptions: 2,655 respellings of the
# COSCACH spelling review. Letter names are joined with the stress on the last
# letter (psu peeseú). AND, UP, WoW and RR keep their exact-case readings and
# lowercase rr stays the backchannel. aylwin is ˈejl.win, revenge re.ˈbenʝ and
# selj selʝ, as fixed transcriptions. Five more
# phrases: baby shower, bass house, pokémon go, ray bradbury, scrum master.
#
# A built-in entry that ends in a period (J., Dr., C.C.U.) matches with its
# period; until 2.0.34 the period was split off first, so such entries never
# matched and Dr. was read as the backchannel dr.
#
# A written uno is never cut to un (uno nunca sabe). A number before a unit or
# a currency is still read un (1 km, $1).
#
# A comma after a word or a number is the short pause in running text, as it
# already was with --tokens (add_comma_pauses above now works there too).
#
# Syllables: a falling diphthong whose strong vowel has the written accent is
# a diphthong (náufrago ˈnaw.fɾa.ɡo, máicro ˈmaj.kɾo); a liquid after a glide
# and before a glide begins the syllable with it (dinosaurio di.no.ˈsaw.ɾjo);
# before a consonant it closes the syllable (bourbon ˈbowɾ.bon); i before u
# and another vowel is a vowel (aliuén a.li.ˈwen); the hiatus of estadounidense
# is split (es.ta.do.u.ni.ˈden.se); no syllable is left without a vowel
# (berns ˈbeɾns).
#
# The hiatus with stress on i is kept only in the -uir verb forms that have it
# (huir, construir, construimos, construiste, incluido), and in those often
# written without the accent (vos incluis, construia). Every other ui is a
# diphthong: buitre ˈbwi.tɾe, Luis lwis, intuición in.twi.ˈsjon (it had two
# stresses), huincha ˈwin.ʧa, huiro ˈwi.ɾo.
#
# The letter y is the vowel i when no vowel is next to it (Lynn, sexy, whisky,
# nylon, Yvonne) and the glide between a vowel and a consonant (Reynaldo
# rej.ˈnal.do, boycott boj.ˈkot); before it they all had the consonant ʝ.
#
# A colon is the long pause in every mode, as a semicolon is; with --tokens
# and after a number it was the short pause. A full stop after a number is
# the long pause in running text (eran 12. Bajamos); it was deleted. With
# --tokens, ipa_long_pause_two_singles (-lp2) now applies to punctuation
# tokens too.
#
# Every output file is Unicode NFC: a nasal vowel is one character (ã), not
# the vowel and U+0303. -mfa dictionaries are the exception: they keep the
# acoustic model's spelling, which is the vowel and U+0303.
#
# A number before a noun agrees with it in gender (1 casa una casa, 21 años
# veintiún años, 200 personas doscientas personas). A number written with a
# point and not three digits after it is a decimal read with punto (12.30
# doce punto treinta, 3.75 tres punto setenta y cinco); a time is written
# with a colon (12:30 doce treinta). ª and letter suffixes give feminine and plural ordinals (1.ª
# and 1a primera, 3as terceras, 1er primer). With ipa_pause_symbols = 0
# (-nopi) punctuation after a word gives ## or (...), a comma (.).


################################################################################
# CHANGES IN v2.0.34 THAT NO SETTING CONTROLS                                  #
################################################################################

# With --tokens, a token that is only an ellipsis (..., or …) is the long
# pause, as in running text; until 2.0.33 it produced nothing and the narrow
# rules ran across it.


################################################################################
# CHANGES IN v2.0.33 THAT NO SETTING CONTROLS                                  #
################################################################################

# Built-in phrase readings, matched without regard to case across spaces,
# underscores and apostrophes: Guns N' Roses (and guns and roses) is read
# gansenróses; rock and roll, rock n' roll and rock 'n' roll are read rocanról.
# With --tokens, a phrase spread over several tokens gets its reading on the
# first token and empty fields on the others.
#
# AC/DC, ACDC and AC-DC are read eisidísi.


################################################################################
# CHANGES IN v2.0.32 THAT NO SETTING CONTROLS                                  #
################################################################################

# Built-in pronunciation tables, applied to whole tokens before any other
# processing: acronyms and codes read as letters, respelling overrides, and
# backchannels and fillers with fixed transcriptions (mm is deliberately left
# out: filler or millimetres is a judgement call).
#
# XXXREDACTEDXXX and XXXNUMXXX are transcribed as the long pause (‖, or || with
# ipa_long_pause_two_singles); XXXUNINTELLIGIBLEXXX as the short pause (|), in
# every output mode.
#
# An all-capitals token that can be pronounced as a Spanish word is read as a
# word (INACAP, SENAME); only unpronounceable ones are spelled out (PDI, TVN).
#
# Lowercase tokens made only of the letters i v x l c d m are spelled out only
# when they contain no vowel (cd, dvd); mi, di, vivi, clic and the like are read
# as words, runs of m are left as fillers, and xx is read as veinte.
#
# The underscore is a word separator, no longer read aloud as "guión bajo"
# (it still is inside URLs and e-mail addresses).
#
# Three or more identical consonant letters in a row collapse to two (rr, ll,
# cc, nn) or one (garrra garra, zapatilllas zapatillas). Runs of m are left
# alone.
